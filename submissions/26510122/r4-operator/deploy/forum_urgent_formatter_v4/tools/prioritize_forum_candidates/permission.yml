name: prioritize_forum_candidates
description: Accepts exactly {"mode":"context"}. Reads host_inputs/forum_candidates.json and returns a bounded public view with producer-verified reply eligibility. Eligible C stock with 20 minutes to 6 hours remaining appears first among visible items. When this exception opens the two-C guard, other C stock stays closed if the guard would have applied. Honor spotlight_allowed and returned spotlight_eligible. Replies are unaffected by the guard. The downstream model chooses an item or holds after revalidation. This tool has no posting authority.
permission:
  pay_limit: 0
  timeout: 15
logic: logic.py
test: test.py
version: 4
replaces: prioritize_forum_candidates@3
