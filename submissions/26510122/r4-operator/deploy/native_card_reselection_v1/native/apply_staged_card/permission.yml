name: apply_staged_card
description: outseop-r4 카드 적용·원복. 인자 {op:'apply'|'rollback',record_id:<SHA256>}. 기존 v1 authority 형식과 same-choice 경로는 그대로 사용한다. 공식 운영 Mind 재선택 시 호스트는 기존 authority 원본 SHA256으로 주소화한 읽기 전용 host_inputs/card_reselection/<authority SHA256>.json을 추가한다. 정확한 키는 schema='outseop-r4.card-reselection.v1', mode='official_mind_reselection', authority_sha256, head_event, record_id, before_sha256, after_sha256, stage_source_sha256, original_view_sha256, fresh_view_sha256, skus, stage_created_ns다. 호스트는 모델·고객·사업도구가 쓸 수 없는 경로에서 공식 Mind가 전체 공개 후보를 compare한 뒤 직접 고른 SKU를 같은 실행의 고정 stage v1에 전달하고, 실제 생성 파일의 mtime_ns 및 원본을 보존한다. 같은
permission:
  write: [card.json, card_publication]
  pay_limit: 0
  timeout: 45
logic: logic.py
test: test.py
version: 4
replaces: apply_staged_card@3
