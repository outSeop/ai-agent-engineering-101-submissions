name: prioritize_forum_candidates
description: Accepts exactly {"mode":"context"}. Reads only host_inputs/forum_candidates.json, with required own_spotlight_history in the existing snapshot schema. Returns a bounded public candidate view for forum_marketing@5. Honor spotlight_allowed and original spotlight_eligible when choosing a spotlight. When selection_policy.consecutive_c_guard is true, choose an otherwise eligible A/B spotlight or hold. The guard does not restrict replies. The downstream model chooses the actual item or holds after revalidation.
permission:
  pay_limit: 0
  timeout: 15
logic: logic.py
test: test.py
version: 2
replaces: prioritize_forum_candidates@1
