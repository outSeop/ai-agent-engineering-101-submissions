name: read_customer_offers
description: 고정 읽기 전용 host_inputs/customer_offer_context.json의 단위별 재고 사실을 조회한다. 첫 요청은 {op:'context', skus?:[SKU], min_remaining_seconds?:정수, offset?:정수, snapshot?:문자열}이다. 후속 요청은 next_args 객체 전체를 그대로 사용한다. next_args는 필터와 스냅샷을 포함한다. total_count는 필터를 충족하는 전체 단위 수, returned_count는 이번 페이지에 포함된 완전한 행 수다. row_fragment가 있으면 같은 unit_index의 text를 offset 순서로 이어 붙여 JSON으로 파싱한다. complete가 true이면 해당 행의 조립이 끝난다. as_of는 조회 기준 UTC 초다. expires_at을 모르면 remaining_seconds도 null이다. 만료된 available은 expired로 표시한다. 파일 변경, 시간 경과로 인한 필터 결과 변경 또는 조립 중인 단위의 만료는 명시적 오류로 반환한다. 이 파일의 출처, 시장 사실, 서명 및 가격 권한은 별도 호스트 검증 대상이다. name과 category_p
permission:
  pay_limit: 0
  timeout: 10
logic: logic.py
test: test.py
version: 2
replaces: read_customer_offers@1
