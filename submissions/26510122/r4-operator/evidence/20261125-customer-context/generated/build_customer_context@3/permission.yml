name: build_customer_context
description: {"op":"context"}는 고정 reader의 모든 페이지와 fragment를 조립한다. verified_context.inventory의 각 행은 common을 복사하고 columns와 rows의 셀을 짝지어 복원한다. lookup에 있는 열의 셀은 해당 배열의 0부터 시작하는 인덱스다. 나머지 셀은 원값이다. expires_at은 remaining_seconds가 null이면 null, 그 외 as_of+remaining_seconds다. text_limit가 null이면 원문, 정수면 name 앞부분(최소 12자 분량)과 category_path의 정확한 최상위 항목이다. 배열 경로는 배열로 유지된다. 전체 이름과 분류 경로는 {"op":"details","snapshot":S,"detail_pin":P,"as_of":T,"row":I,"sku":K}로 조회한다. S/P/T는 context 응답의 같은 이름 필드, I는 0부터 시작하는 행 번호, K는 복원한 행의 sku다. 첫 상세 호출에는 offset을 생략한다. fragment가 오면 next_args 전체를 그대로 호출한다. 커서는 같은 6개 필드와 양의 800배수 offset을 담는다. f
permission:
  pay_limit: 0
  timeout: 180
logic: logic.py
test: test.py
version: 3
replaces: build_customer_context@2
