name: build_customer_context
description: 읽기 전용. {"op":"context"}는 해시 고정 read_customer_offers v2의 모든 페이지·fragment를 한 번에 조립한다. verified_context에서 inventory 외 필드는 broker 원본 값이다. inventory의 각 행은 common을 복사하고 columns와 rows의 해당 배열을 짝지어 복원한다. lookup에 있는 열은 셀을 해당 배열의 0부터 시작하는 인덱스로 해석하고, 나머지 셀은 원값이다. expires_at은 remaining_seconds가 null이면 null, 그 외 as_of+remaining_seconds다. text_limit가 null이면 name과 category_path는 원문이다. 정수면 name의 앞 12자 이상과 category_path의 정확한 최상위 항목만 제공한다. 배열 경로는 길이 1 배열로, 문자열 경로는 그대로 표현한다. category는 원래 표준 분류 키이며 category_path의 첫 항목으로 식품 여부를 판별할 수 있다. 정확한 name/category_path는 {"op":"details","snapshot":<응답 snapshot>,"detail_pin":
permission:
  pay_limit: 0
  timeout: 180
logic: logic.py
test: test.py
version: 2
replaces: build_customer_context@1
