name: refund_review_binding
description: 기존 sale/refund 구조를 재현한 가상 장부에서 익명 사건의 검토 준비와 모델 결정 접수를 검증한다. args: {operation: 'prepare'|'record_decision', case_id: refund_review_intake 형식의 익명 사건 ID}. forge 테스트의 가상 호스트만 증빙과 모델 결정을 넣는다. 송금 권한은 없다.
permission:
  write: [refund_binding_fixture.sqlite3, refund_binding_fixture.sqlite3-journal]
  identity: [shop]
  pay_limit: 0
  timeout: 30
logic: logic.py
test: test.py
version: 1
