name: public_catalogue
description: 고정 공개 목록. context {op,text,focus_skus?}, search {op,q?,skus?,exclude_skus?,category?,grade?,max_price?,min_remaining_seconds?,sort?,limit?}. 조회는 ready·rows·catalogue, 최대 8행 및 JSON 5500자. 안전한 이름은 원문 전체를 표시하고 미검증 이름의 행은 제외 건수를 공개합니다. 다음 페이지는 catalogue.next_args 전체(offset, limit, snapshot, as_of, query_id 포함)를 사용하세요. render {op,items:[{sku,grade}]}는 서로 다른 SKU·등급 쌍 1~3개를 모두 표시합니다. fallback {op,text}는 명시적인 공개 정보 문의만 지원하며 지정한 SKU의 모든 일치 행을 최대 3행까지 표시합니다. 분류만 지정한 문의는 첫 3행까지 표시하며 일부인지 명시합니다. 문구는 rendered·reply·observed_at·valid_until, 최대 450자. 안전한 전체 이름이나 요청한 항목을 모두 담을 수 없으면 unavailable·reason.
permission:
  pay_limit: 0
  timeout: 12
logic: logic.py
test: test.py
version: 3
replaces: public_catalogue@2
