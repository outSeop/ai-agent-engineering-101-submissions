name: stock_procurement
description: V13 procurement. Actions: context {line_cap?}, plan {plan,decision}, execute, reconcile. Uses the pinned public parent, public settlement comparables, optional recorder priority, and an owned campaign policy at state/r4-benefits/stock-campaign-policy.json. Draft responses contain the public model projection.
permission:
  network: [market.ourolabs.ai, rpc-testnet.maroo.io]
  write: [state/r4-benefits]
  identity: [shop]
  wallet: [pay]
  pay_limit: 1000000
  timeout: 155
logic: logic.py
test: test.py
version: 13
replaces: stock_procurement@12
