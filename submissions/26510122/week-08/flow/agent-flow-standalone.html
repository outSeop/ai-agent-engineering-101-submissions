  &lt;script&gt;

    const roleColors = { model: &#x27;var(--viz-series-1)&#x27;, tool: &#x27;var(--viz-series-2)&#x27;, harness: &#x27;var(--viz-series-3)&#x27;, market: &#x27;var(--viz-series-4)&#x27; };
    const storageKey = &#x27;ax-r3-flow-v1-2026-11-02&#x27;;

    let spec = clone(defaults), scope = &#x27;inventory&#x27;, mode = &#x27;planned&#x27;, selected = &#x27;I04&#x27;, trail = [], editing = false, dirty = false;
