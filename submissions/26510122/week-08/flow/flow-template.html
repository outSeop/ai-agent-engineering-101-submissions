<div id="r3-flow-editor" data-ready="false">
  <style>
    #r3-flow-editor { container-type: inline-size; color: var(--foreground); }
    #r3-flow-editor .flow-heading, #r3-flow-editor .flow-section { display: grid; gap: calc(var(--font-size-base) * .5); }
    #r3-flow-editor .flow-heading { margin-bottom: calc(var(--font-size-base) * 1); }
    #r3-flow-editor .flow-layout { display: grid; gap: calc(var(--font-size-base) * 1); align-items: start; }
    #r3-flow-editor .flow-main { min-width: 0; }
    #r3-flow-editor .flow-canvas { position: relative; width: 100%; }
    #r3-flow-editor .flow-arrows { position: absolute; inset: 0; width: 100%; pointer-events: none; overflow: visible; }
    #r3-flow-editor .flow-node { position: absolute; display: grid; gap: calc(var(--font-size-base) * .25); align-content: start; }
    #r3-flow-editor .flow-node-meta { display: flex; align-items: center; justify-content: center; gap: calc(var(--font-size-base) * .25); }
    #r3-flow-editor .role-mark { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    #r3-flow-editor .flow-legend { display: flex; flex-wrap: wrap; gap: calc(var(--font-size-base) * .75); margin-block: calc(var(--font-size-base) * .75); }
    #r3-flow-editor .flow-legend > span { display: inline-flex; align-items: center; gap: calc(var(--font-size-base) * .3); }
    #r3-flow-editor .flow-inspector { display: grid; gap: calc(var(--font-size-base) * .75); }
    #r3-flow-editor .detail-pair { display: grid; gap: calc(var(--font-size-base) * .2); }
    #r3-flow-editor .flow-field { display: grid; gap: calc(var(--font-size-base) * .3); min-width: 0; }
    #r3-flow-editor .transition { display: grid; gap: calc(var(--font-size-base) * .3); margin-top: calc(var(--font-size-base) * .65); }
    #r3-flow-editor .flow-source { overflow-wrap: anywhere; }
    #r3-flow-editor .flow-json { margin-top: calc(var(--font-size-base) * 1); }
    #r3-flow-editor .flow-json > div { display: grid; gap: calc(var(--font-size-base) * .75); margin-top: calc(var(--font-size-base) * .5); }
    #r3-flow-editor .flow-message { margin-top: calc(var(--font-size-base) * .5); }
    #r3-flow-editor .flow-controls { display: flex; flex-wrap: wrap; align-items: end; gap: calc(var(--font-size-base) * .75); }
    #r3-flow-editor .flow-controls > label { flex: 1 1 150px; max-width: 240px; }
    #r3-flow-editor .flow-editor-fields { display: grid; gap: calc(var(--font-size-base) * .6); }
    #r3-flow-editor .flow-path { display: flex; gap: calc(var(--font-size-base) * .25); flex-wrap: wrap; margin-bottom: calc(var(--font-size-base) * .4); }
    @container (min-width: 950px) { #r3-flow-editor .flow-layout { grid-template-columns: minmax(0, 1fr) 300px; } }
  </style>
  <div class="flow-heading">
    <h2>R3 에이전트 흐름</h2>
    <div class="viz-row"><span class="viz-badge">설계 검토용</span><span class="text-small">실행 코드와 별도 · 서버 미배포</span></div>
    <div class="flow-controls">
      <label class="form-label flow-field">흐름<select id="flow-scope" class="form-select"><option value="inventory">재고 관리</option><option value="seller">우리 가게의 판매</option><option value="buyer">우리 buyer의 구매</option><option value="overview">전체 역할 연결</option></select></label>
      <label class="form-label flow-field">기준<select id="flow-mode" class="form-select"><option value="planned">목표 설계</option><option value="current">현재 코드</option></select></label>
      <button type="button" class="btn" id="flow-export">JSON 내보내기</button>
      <button type="button" class="btn btn-ghost" id="flow-reset">수정 초기화</button>
    </div>
  </div>
  <div class="flow-legend text-small" aria-label="담당 역할">
    <span><span class="role-mark" style="background:var(--viz-series-1)"></span>모델 판단</span>
    <span><span class="role-mark" style="background:var(--viz-series-2)"></span>계산 툴</span>
    <span><span class="role-mark" style="background:var(--viz-series-3)"></span>하네스</span>
    <span><span class="role-mark" style="background:var(--viz-series-4)"></span>시장·외부</span>
  </div>
  <div class="flow-layout">
    <div class="flow-main">
      <div class="flow-path" id="flow-path" aria-label="선택한 이동 경로"></div>
      <div class="flow-canvas" id="flow-canvas" role="group" aria-label="선택 가능한 단계와 연결 흐름"></div>
    </div>
    <div class="card flow-inspector" id="flow-inspector" aria-label="선택 단계와 이동 조건"></div>
  </div>
  <details class="flow-json" id="flow-json-panel">
    <summary>JSON 저장·불러오기</summary>
    <div>
      <label class="form-label flow-field">설계 JSON<textarea class="form-control" id="flow-json-text" rows="9" spellcheck="false"></textarea></label>
      <div class="viz-row"><button type="button" class="btn" id="flow-copy">JSON 복사</button><button type="button" class="btn btn-primary" id="flow-import">붙여 넣은 JSON 반영</button></div>
      <label class="form-label flow-field">저장한 JSON 파일 불러오기<input class="form-control" type="file" id="flow-file" accept=".json,application/json"></label>
    </div>
  </details>
  <div class="flow-message text-small" id="flow-message" role="status" aria-live="polite"></div>
  <div class="sr-only" id="flow-error" role="alert"></div>
  <script type="application/json" id="flow-default-data">__FLOW_SPEC_JSON__</script>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('r3-flow-editor');
    const $ = id => root.querySelector('#' + id);
    const defaults = JSON.parse($('flow-default-data').textContent);
    const clone = value => JSON.parse(JSON.stringify(value));
    const roleNames = { model: '모델', tool: '툴', harness: '하네스', market: '시장·외부' };
    const statusNames = { implemented: '현재 구현', agreed: '합의한 방향', proposed: '제안·미확정', market: '시장·키트 규칙' };
    const roleColors = { model: 'var(--viz-series-1)', tool: 'var(--viz-series-2)', harness: 'var(--viz-series-3)', market: 'var(--viz-series-4)' };
    const storageKey = 'ax-r3-flow-v1-2026-11-02';
    const nodeFields = ['label', 'role', 'status', 'input', 'output', 'action'];
    const edgeFields = ['label', 'condition', 'to'];
    let spec = clone(defaults), scope = 'inventory', mode = 'planned', selected = 'I04', trail = [], editing = false, dirty = false;
    let drawFrame = 0;

    function el(tag, attrs = {}, text) {
      const item = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === 'class') item.className = value;
        else item.setAttribute(key, String(value));
      }
      if (text !== undefined) item.textContent = text;
      return item;
    }
    function message(text, error = false) {
      $('flow-message').textContent = text;
      $('flow-error').textContent = error ? text : '';
      $('flow-message').classList.toggle('text-destructive', error);
    }
    function validate(candidate) {
      if (!candidate || candidate.version !== 1 || !Array.isArray(candidate.flows) || candidate.flows.length < 1 || candidate.flows.length > 8) throw Error('지원하는 version 1 설계 JSON이 필요합니다.');
      const flowIds = new Set();
      const checkText = (value, max = 3000) => { if (typeof value !== 'string' || value.length > max) throw Error('문자열 필드의 형식 또는 길이가 잘못됐습니다.'); };
      const checkModes = item => { if (item.modes && (!Array.isArray(item.modes) || item.modes.some(x => !['planned','current'].includes(x)))) throw Error('기준은 planned/current만 사용할 수 있습니다.'); };
      for (const flow of candidate.flows) {
        if (!/^[a-z][a-z0-9-]*$/.test(flow.id) || flowIds.has(flow.id)) throw Error('흐름 ID가 잘못됐거나 중복됐습니다.');
        flowIds.add(flow.id); checkText(flow.title, 80);
        if (!Array.isArray(flow.nodes) || !flow.nodes.length || flow.nodes.length > 40 || !Array.isArray(flow.edges) || flow.edges.length > 120) throw Error('노드·연결 수가 허용 범위를 벗어났습니다.');
        const ids = new Set(), edgeIds = new Set();
        for (const node of flow.nodes) {
          if (!/^[A-Z][A-Z0-9_-]*$/.test(node.id) || ids.has(node.id)) throw Error('노드 ID가 잘못됐거나 중복됐습니다.');
          ids.add(node.id); checkModes(node);
          if (!Number.isInteger(node.col) || node.col < 0 || node.col > 2 || !Number.isInteger(node.row) || node.row < 0 || node.row > 12) throw Error('노드 위치가 허용 범위를 벗어났습니다.');
          for (const view of [node, node.current].filter(Boolean)) {
            for (const key of nodeFields) if (key in view) checkText(view[key], key === 'label' ? 80 : 3000);
            if (view.role && !roleNames[view.role]) throw Error('담당 역할이 잘못됐습니다.');
            if (view.status && !statusNames[view.status]) throw Error('상태가 잘못됐습니다.');
          }
          if (!node.label || !node.role || !node.status) throw Error('노드 이름·역할·상태가 필요합니다.');
        }
        for (const edge of flow.edges) {
          if (typeof edge.id !== 'string' || edgeIds.has(edge.id) || !ids.has(edge.from) || !ids.has(edge.to)) throw Error('연결 ID 또는 출발·도착 노드가 잘못됐습니다.');
          edgeIds.add(edge.id); checkModes(edge);
          for (const view of [edge, edge.current].filter(Boolean)) {
            if (view.label !== undefined) checkText(view.label, 100);
            if (view.condition !== undefined) checkText(view.condition);
            if (view.to !== undefined && !ids.has(view.to)) throw Error('연결할 노드가 없습니다.');
          }
          for (const viewMode of ['planned','current']) {
            const active = !edge.modes || edge.modes.includes(viewMode);
            const to = viewMode === 'current' && edge.current?.to ? edge.current.to : edge.to;
            if (active && [edge.from,to].some(id => { const n=flow.nodes.find(x=>x.id===id); return n.modes && !n.modes.includes(viewMode); })) throw Error('해당 기준에서 숨겨진 노드로 연결할 수 없습니다.');
          }
        }
      }
      for (const id of ['inventory','seller','buyer','overview']) if (!flowIds.has(id)) throw Error('재고·판매·구매·전체 흐름을 유지해야 합니다.');
      if (JSON.stringify(candidate).length > 180000) throw Error('설계 JSON이 너무 큽니다.');
      return candidate;
    }
    function changes() {
      const patches=[];
      for (const flow of spec.flows) {
        const base=defaults.flows.find(x=>x.id===flow.id);
        for (const group of ['nodes','edges']) {
          for (const item of flow[group]) {
            const original=base?.[group].find(x=>x.id===item.id);
            if (JSON.stringify(item)!==JSON.stringify(original)) patches.push({flow:flow.id,group,item});
          }
        }
      }
      return patches;
    }
    function currentState() {
      return {scope,mode,selected,trail:trail.slice(-10),patches:changes()};
    }
    function persist() {
      const state=currentState(); let localSaved=false;
      try { localStorage.setItem(storageKey, JSON.stringify({spec,state})); localSaved=true; } catch (_) {}
      const hostState={...state};
      if (JSON.stringify(hostState).length > 13000) { hostState.patches=[]; message('수정 내용이 큽니다. JSON 내보내기로 보관하세요.'); }
      if (window.openai?.setWidgetState) {
        Promise.resolve(window.openai.setWidgetState({ modelContent: {flow:scope,basis:mode,node:selected,modified:dirty}, privateContent:hostState })).catch(()=>{});
      }
      return localSaved;
    }
    function restore(state) {
      if (!state || typeof state !== 'object') return;
      const restored=clone(defaults);
      for (const patch of state.patches || []) {
        const flow=restored.flows.find(x=>x.id===patch.flow);
        if (!flow || !['nodes','edges'].includes(patch.group)) continue;
        const index=flow[patch.group].findIndex(x=>x.id===patch.item?.id);
        if (index>=0) flow[patch.group][index]=patch.item;
      }
      validate(restored); spec=restored;
      if (spec.flows.some(x=>x.id===state.scope)) scope=state.scope;
      if (['current','planned'].includes(state.mode)) mode=state.mode;
      selected=typeof state.selected==='string'?state.selected:selected;
      trail=Array.isArray(state.trail)?state.trail.slice(-10):[];
      dirty=changes().length>0;
    }
    function flow() { return spec.flows.find(x=>x.id===scope); }
    function visible(item) { return !item.modes || item.modes.includes(mode); }
    function effective(item) { return {...item,...(mode==='current'?item.current||{}:{})}; }
    function nodes() { return flow().nodes.filter(visible).map(effective); }
    function edges() { const ids=new Set(nodes().map(n=>n.id)); return flow().edges.filter(visible).map(effective).filter(e=>ids.has(e.from)&&ids.has(e.to)); }
    function select(id, follow=false) {
      selected=id; editing=false;
      if(follow) trail=[...trail,id].slice(-10); else trail=[id];
      render(); persist();
    }
    function safeSelection() { if (!nodes().some(n=>n.id===selected)) selected=nodes()[0].id; }
    function field(label, tag, value, id, choices) {
      const wrap=el('label',{class:'form-label flow-field'},label);
      const control=el(tag,{class:tag==='select'?'form-select':'form-control',id});
      if (tag==='select') for(const [key,name] of Object.entries(choices)) control.append(el('option',{value:key},name));
      else if(tag==='textarea') control.setAttribute('rows',label==='처리 내용'?'4':'2');
      control.value=value||''; wrap.append(control); return wrap;
    }
    function renderInspector() {
      const panel=$('flow-inspector'); panel.replaceChildren();
      const node=nodes().find(n=>n.id===selected);
      const heading=el('div',{class:'flow-section'});
      heading.append(el('div',{class:'text-small'},`${node.id} · ${roleNames[node.role]} · ${statusNames[node.status]}`),el('h3',{},node.label));
      panel.append(heading);
      if(!editing) {
        for(const [key,label] of [['input','들어오는 것'],['action','처리 내용'],['output','나가는 것']]) {
          const pair=el('div',{class:'detail-pair'}); pair.append(el('span',{class:'text-small'},label),el('div',{},node[key]||'—')); panel.append(pair);
        }
        if(node.source) panel.append(el('div',{class:'text-small flow-source'},'근거: '+node.source));
        const edit=el('button',{class:'btn',type:'button'},'이 단계·조건 수정'); edit.addEventListener('click',()=>{editing=true;renderInspector();}); panel.append(edit);
      } else {
        const fields=el('div',{class:'flow-editor-fields'});
        for(const [key,label,tag,options] of [['label','단계 이름','input'],['role','담당 역할','select',roleNames],['status','구현·합의 상태','select',statusNames],['input','들어오는 것','textarea'],['action','처리 내용','textarea'],['output','나가는 것','textarea']]) fields.append(field(label,tag,node[key],'edit-'+key,options));
        panel.append(fields);
      }
      const next=el('div',{class:'flow-section'}); next.append(el('h3',{},'조건과 다음 단계'));
      const outgoing=edges().filter(e=>e.from===selected);
      if(!outgoing.length) next.append(el('div',{class:'text-small'},'이 흐름의 마지막 단계'));
      for(const edge of outgoing) {
        const target=nodes().find(n=>n.id===edge.to), item=el('div',{class:'transition'});
        if(editing) {
          item.append(field('화살표 이름','input',edge.label,'edge-label-'+edge.id));
          item.append(field('이동 조건','textarea',edge.condition,'edge-condition-'+edge.id));
          const destinations=Object.fromEntries(nodes().map(n=>[n.id,n.id+' '+n.label]));
          item.append(field('다음 단계','select',edge.to,'edge-to-'+edge.id,destinations));
        } else {
          const go=el('button',{class:'btn viz-tile',type:'button'},`${edge.label} → ${target.id} ${target.label}`);
          go.addEventListener('click',()=>select(edge.to,true));
          item.append(go,el('div',{class:'text-small'},edge.condition));
          if(edge.status==='proposed') item.append(el('span',{class:'text-small'},'제안·미확정 연결'));
        }
        next.append(item);
      }
      panel.append(next);
      if(editing) {
        const actions=el('div',{class:'viz-row'});
        const save=el('button',{class:'btn btn-primary',type:'button'},'도식에 반영');
        const cancel=el('button',{class:'btn',type:'button'},'수정 취소');
        save.addEventListener('click',()=>{
          const backup=clone(spec);
          try {
            const raw=flow().nodes.find(n=>n.id===selected);
            if(mode==='planned') {
              const priorCurrent={...raw,...raw.current}; raw.current??={};
              for(const key of nodeFields) if(priorCurrent[key]!==undefined) raw.current[key]=priorCurrent[key];
            }
            const dest=mode==='current'?(raw.current??={}):raw;
            for(const key of nodeFields) dest[key]=$('edit-'+key).value.trim();
            for(const edge of outgoing) {
              const rawEdge=flow().edges.find(e=>e.id===edge.id);
              if(mode==='planned') {
                const priorCurrent={...rawEdge,...rawEdge.current}; rawEdge.current??={};
                for(const key of edgeFields) if(priorCurrent[key]!==undefined) rawEdge.current[key]=priorCurrent[key];
              }
              const edgeDest=mode==='current'?(rawEdge.current??={}):rawEdge;
              for(const key of edgeFields) edgeDest[key]=$('edge-'+key+'-'+edge.id).value.trim();
            }
            validate(spec); dirty=true; editing=false; const saved=persist(); render();
            message(saved?'도식에 반영하고 이 브라우저에 저장했습니다. 실행 코드는 별도입니다.':'도식에 반영했습니다. JSON 내보내기로 보관할 수 있습니다.');
          } catch(error) { spec=backup; message(error.message,true); }
        });
        cancel.addEventListener('click',()=>{editing=false;renderInspector();}); actions.append(save,cancel); panel.append(actions);
      }
    }
    function drawGraph() {
      const canvas=$('flow-canvas'), width=canvas.clientWidth;
      if(width<1) return;
      const list=nodes(), compact=width<570, positions=new Map();
      const top=40, cell=(width-44)/3;
      canvas.replaceChildren();
      for(let i=0;i<list.length;i++) {
        const node=list[i], w=compact?Math.max(160,width-82):Math.max(125,cell-30);
        const x=compact?(width-w)/2:22+node.col*cell+(cell-w)/2;
        const wrap=el('div',{class:'flow-node','data-node-id':node.id});
        Object.assign(wrap.style,{left:x+'px',top:'0px',width:w+'px'});
        const meta=el('div',{class:'flow-node-meta text-small'}), dot=el('span',{class:'role-mark','aria-hidden':'true'}); dot.style.background=roleColors[node.role];
        meta.append(dot,el('span',{},node.id+' · '+roleNames[node.role]));
        const button=el('button',{class:'btn viz-tile',type:'button','aria-pressed':node.id===selected,'aria-label':`${node.id} ${node.label}, ${roleNames[node.role]}, ${statusNames[node.status]}`},node.label);
        button.addEventListener('click',()=>select(node.id));
        wrap.append(meta,button,el('div',{class:'flow-node-meta text-small'},statusNames[node.status]));
        canvas.append(wrap);
        positions.set(node.id,{x,y:0,w,h:Math.max(86,wrap.getBoundingClientRect().height+6),row:node.row,index:i,wrap});
      }
      const rowHeights=new Map();
      for(const p of positions.values()) rowHeights.set(p.row,Math.max(rowHeights.get(p.row)||0,p.h));
      let cursor=top;
      const rowTops=new Map();
      for(const row of [...rowHeights.keys()].sort((a,b)=>a-b)) {rowTops.set(row,cursor);cursor+=rowHeights.get(row)+68;}
      cursor=top;
      for(const p of positions.values()) {p.y=compact?cursor:rowTops.get(p.row);if(compact)cursor+=p.h+59;p.wrap.style.top=p.y+'px';}
      const height=Math.max(...[...positions.values()].map(p=>p.y+p.h))+45;
      canvas.style.height=height+'px';
      const ns='http://www.w3.org/2000/svg';
      const svg=document.createElementNS(ns,'svg'); svg.setAttribute('class','flow-arrows'); svg.setAttribute('height',height); svg.setAttribute('viewBox',`0 0 ${width} ${height}`); svg.setAttribute('aria-hidden','true');
      const defs=document.createElementNS(ns,'defs');
      for(const name of ['neutral','active']) {
        const marker=document.createElementNS(ns,'marker'); marker.setAttribute('id','flow-arrow-'+name); marker.setAttribute('markerWidth','7'); marker.setAttribute('markerHeight','7'); marker.setAttribute('refX','6'); marker.setAttribute('refY','3.5'); marker.setAttribute('orient','auto');
        const triangle=document.createElementNS(ns,'path'); triangle.setAttribute('d','M0 0 L7 3.5 L0 7 Z'); triangle.setAttribute('fill',name==='active'?'var(--foreground)':'var(--muted-foreground)'); marker.append(triangle); defs.append(marker);
      }
      svg.append(defs);
      for(const edge of edges()) {
        const a=positions.get(edge.from), b=positions.get(edge.to), active=edge.from===selected;
        let d, lx, ly;
        if(!compact && Math.abs(a.y-b.y)<1 && Math.abs(a.x-b.x)<cell*1.1) {
          const right=b.x>a.x, sx=right?a.x+a.w:a.x, tx=right?b.x:b.x+b.w;
          d=`M${sx} ${a.y+38} L${tx} ${b.y+38}`; lx=(sx+tx)/2; ly=a.y-12;
        } else if(!compact && Math.abs(a.y-b.y)<1) {
          const band=a.y+a.h+24, sx=a.x+a.w/2, tx=b.x+b.w/2;
          d=`M${sx} ${a.y+a.h} L${sx} ${band} L${tx} ${band} L${tx} ${b.y+b.h+5}`; lx=(sx+tx)/2; ly=band-6;
        } else if(b.y>a.y && Math.abs(b.x-a.x)<3 && (compact ? b.index===a.index+1 : b.row===a.row+1)) {
          d=`M${a.x+a.w/2} ${a.y+a.h} L${b.x+b.w/2} ${b.y-5}`; lx=a.x+a.w/2+8; ly=(a.y+a.h+b.y)/2;
        } else if(!compact && b.y>a.y && b.row===a.row+1) {
          const sy=a.y+a.h, ty=b.y-5, mid=(sy+ty)/2;
          d=`M${a.x+a.w/2} ${sy} L${a.x+a.w/2} ${mid} L${b.x+b.w/2} ${mid} L${b.x+b.w/2} ${ty}`; lx=(a.x+a.w/2+b.x+b.w/2)/2; ly=mid-6;
        } else {
          const right=a.x>=width/2 || b.x>=width/2;
          const rail=right?width-9:9, sx=a.x+a.w/2, tx=b.x+b.w/2;
          const backwards=b.y<=a.y, sy=backwards?a.y:a.y+a.h;
          const sourceBand=backwards?a.y-18:a.y+a.h+18, targetBand=b.y-18;
          d=`M${sx} ${sy} L${sx} ${sourceBand} L${rail} ${sourceBand} L${rail} ${targetBand} L${tx} ${targetBand} L${tx} ${b.y-5}`; lx=(sx+rail)/2; ly=sourceBand-6;
        }
        const path=document.createElementNS(ns,'path'); path.setAttribute('d',d); path.setAttribute('fill','none'); path.setAttribute('stroke',active?'var(--foreground)':'var(--muted-foreground)'); path.setAttribute('stroke-width',active?'1.8':'1'); path.setAttribute('opacity',active?'1':'.45'); path.setAttribute('marker-end',`url(#flow-arrow-${active?'active':'neutral'})`);
        if(edge.status==='proposed') path.setAttribute('stroke-dasharray','4 4'); svg.append(path);
        if(active && !compact) {
          const text=document.createElementNS(ns,'text'); text.setAttribute('x',Math.max(45,Math.min(width-45,lx))); text.setAttribute('y',ly); text.setAttribute('text-anchor','middle'); text.setAttribute('class','text-small'); text.setAttribute('fill','var(--foreground)'); text.textContent=edge.label; svg.append(text);
        }
      }
      canvas.prepend(svg);
    }
    function render() {
      safeSelection(); $('flow-scope').value=scope; $('flow-mode').value=mode;
      $('flow-path').replaceChildren();
      for(const [index,id] of trail.entries()) {
        if(index) $('flow-path').append(el('span',{class:'text-small','aria-hidden':'true'},'→'));
        const n=nodes().find(x=>x.id===id); if(!n) continue;
        const button=el('button',{class:'btn btn-ghost',type:'button'},id); button.addEventListener('click',()=>select(id)); $('flow-path').append(button);
      }
      renderInspector(); drawGraph(); root.dataset.ready='true';
    }
    function importText(text) {
      if(text.length>500000) throw Error('파일이 너무 큽니다.');
      const candidate=validate(JSON.parse(text)); spec=clone(candidate); dirty=true; editing=false; trail=[];
      persist(); render(); message('JSON을 도식에 반영했습니다. 실제 거래 코드에는 적용되지 않습니다.');
    }
    $('flow-scope').addEventListener('change',event=>{scope=event.target.value;selected='';trail=[];editing=false;render();persist();});
    $('flow-mode').addEventListener('change',event=>{mode=event.target.value;trail=[];editing=false;render();persist();});
    $('flow-export').addEventListener('click',()=>{$('flow-json-text').value=JSON.stringify(spec,null,2);$('flow-json-panel').open=true;message('JSON을 복사해 보관하거나 다음 수정에 사용할 수 있습니다.');});
    $('flow-copy').addEventListener('click',async()=>{
      const text=$('flow-json-text'); if(!text.value) text.value=JSON.stringify(spec,null,2);
      try { await navigator.clipboard.writeText(text.value); message('JSON을 복사했습니다.'); }
      catch(_) { text.focus();text.select();message('JSON을 선택했습니다. 복사 단축키로 복사하세요.'); }
    });
    $('flow-import').addEventListener('click',()=>{try{importText($('flow-json-text').value);}catch(error){message('불러오기 실패: '+error.message,true);}});
    $('flow-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>500000)throw Error('파일이 너무 큽니다.');const text=await file.text();importText(text);$('flow-json-text').value=text;}catch(error){message('불러오기 실패: '+error.message,true);}});
    let resetArmed=false;
    $('flow-reset').addEventListener('click',()=>{
      if(!resetArmed){resetArmed=true;message('수정 내용을 지우려면 초기화를 한 번 더 누르세요.');setTimeout(()=>{resetArmed=false;},5000);return;}
      spec=clone(defaults);dirty=false;editing=false;trail=[];resetArmed=false;persist();render();message('기본 설계로 되돌렸습니다.');
    });
    try {
      const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
      if(saved?.spec){spec=validate(saved.spec);scope=saved.state?.scope||scope;mode=saved.state?.mode||mode;selected=saved.state?.selected||selected;dirty=changes().length>0;}
    } catch(_) {spec=clone(defaults);}
    try {if(window.openai?.widgetState?.privateContent) restore(window.openai.widgetState.privateContent);} catch(_) {}
    window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;if(!state)return;try{restore(state);editing=false;render();}catch(_){}});
    new ResizeObserver(()=>{cancelAnimationFrame(drawFrame);drawFrame=requestAnimationFrame(drawGraph);}).observe($('flow-canvas'));
    validate(spec);render();message('단계에서 조건과 다음 이동을 확인하고 수정할 수 있습니다.');
  })();
  </script>
</div>
